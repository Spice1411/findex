name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Type-check with pyright (strict)
        run: uv run pyright

      - name: Run pytest suite with coverage
        run: uv run pytest --benchmark-disable --cov=findex --cov-report=term-missing

      - name: Run pytest-benchmark suite
        run: uv run pytest --benchmark-only
